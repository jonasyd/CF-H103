name: Notify Discord on Push

on:
  push:
    branches:
      - release-v1.0.0   # or your target branch
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Discord
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"🚀 New push to **${{ github.repository }}** by **${{ github.actor }}**. [View Commit](${{ github.event.head_commit.url }})\"}" \
               $DISCORD_WEBHOOK
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
